name: Auto-update uitslagen
# Elk uur: bronnen ophalen, data bijwerken (alleen bij gecontroleerde wijzigingen), deployen via staging en productie.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
concurrency:
  group: auto-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Update, deploy (staging en productie)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/auto-update.py
      - name: Push wijzigingen naar main
        run: |
          if [ -n "$(git status --porcelain data.js)" ] || [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push origin HEAD:main
          else
            echo "Geen wijzigingen om te pushen"
          fi
